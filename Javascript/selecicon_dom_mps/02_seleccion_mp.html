<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Biblioteca - Selección DOM</title>

    <script src="02_seleccion_mp.js" defer></script>
</head>
<body>

    <h1></h1>


    <p id="libros-disponibles">Libros disponibles: 0</p>
    <p id="seccion">Sección desconocida</p>
    <p id="prestamo">Préstamo desactivado</p>


    <h1>Selección con Class (Autores)</h1>
    <p class="autor">Gabriel García Márquez</p>
    <p class="autor">Isabel Allende</p>
    <p class="autor">Julio Cortázar</p>

  
    <h2>Catálogo pendiente</h2>
    <h3 id="sucursal">Sucursal pendiente</h3>


    <div id="libro-destacado">
        <p class="estado">Disponible</p>
    </div>
 

    <h1>Géneros Literarios</h1>
    <p class="genero">Novela</p>
    <p class="genero">Ciencia Ficción</p>
    <p class="genero">Historia</p>
    <p class="genero">Poesía</p>
    <p class="genero">Byron</p>
    <p class="genero">García</p>
</body>
</html>
