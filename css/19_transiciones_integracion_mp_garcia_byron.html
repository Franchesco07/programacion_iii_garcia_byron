<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Sistema de Control de Biblioteca</title>

    <link rel="stylesheet" href="19_transiciones_integracion.css">
</head>
<body>

    <header>
        <h1>Control de Biblioteca</h1>

        <p>
            Simulación y gestión del catálogo
            y recursos bibliográficos.
        </p>
    </header>

    <main>

        <section class="escena"
                 aria-label="Zona de consulta animada">

            <div class="estrella estrella1"></div>
            <div class="estrella estrella2"></div>
            <div class="estrella estrella3"></div>
            <div class="estrella estrella4"></div>
            <div class="estrella estrella5"></div>

            <div class="nave">
                <span aria-hidden="true">📖</span>
                <p>Libro</p>
            </div>

            <div class="alerta">
                ALERTA DE DEVOLUCIÓN
            </div>

        </section>

        <section class="controles">

            <h2>Centro de operaciones</h2>

            <div class="panel">

                <article class="radar-contenedor">

                    <h3>Radar de Préstamos</h3>

                    <div class="radar"
                         aria-hidden="true">

                        <div class="pulso"></div>

                        <div class="centro"></div>

                    </div>

                </article>

                <article class="estado">

                    <h3>Estado del sistema</h3>

                    <p>
                        Préstamos activos.
                    </p>

                    <p>
                        Ejemplar: Don Quijote
                    </p>

                    <p>
                        Sección: Sala General
                    </p>

                </article>

            </div>

        </section>

    </main>

    <footer>
        <p>Sistema de Control de Biblioteca - 2026</p>
    </footer>

</body>
</html>
