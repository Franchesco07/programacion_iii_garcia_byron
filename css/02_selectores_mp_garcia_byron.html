<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Biblioteca CSS</title>
    <style>
        h2{ 
            color:chocolate;
        }
        #titulo-principal{
            color:yellowgreen;
            text-align:center;
        }
        #subtitulo {
            color:darkblue;
            text-align:left;
        }
        .terror{
            color:darkred;
            text-align:right;
        }
        .romance{
            color:darkorange;
            text-align:right;
        }
        nav a {
            color: aquamarine;
        }

        h4,h5,h6,h7{
            color:red;
        }

    </style>
</head>
<body>
    <h1>Control de Biblioteca</h1>
    <h2>Categoria</h2>
    <h1>Tipos</h1>
    <h1 id="titulo-principal">Terror</h1>
    <h2 id="subtitulo">psicologico</h2>
    <h3 class="terror">It</h3>
    <h3 class="terror">1984</h3>
    <h3 class="terror">Carrie</h3>
    <h3 class="romance">Cien años de soledad</h3>

    <h1>Selector descendiente</h1>
    <nav>
        <a href="www.google.com">Google</a>
    </nav>

    <h1>Agrupar libros por categoria</h1>
    <h4>Romance</h4>
    <h5>Terror</h5>
    <h6>Suspenso</h6>
    <h7>Historia</h7>
</body>
</html>
