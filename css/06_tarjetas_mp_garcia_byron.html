<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de biblioteca</title>
    <link rel="stylesheet" href="06_tarjetas_mp_garcia_byron.css">
</head>
<body>
    <header>
        <h1>Control de Biblioteca</h1>
        <p>Conoce los Libros y Autores</p>
    </header>
    <main>
        <seccion>
            <h2>Galería de Libros</h2>
            <article class="tarjeta disponible">
                <h3>Cien años de soledad</h3>
                <p>Novela y Realismo Mágico</p>
                <p>Estado: Disponible</p>
            </article>
            <article class="tarjeta prestado">
                <h3>Don Quijote de la Mancha</h3>
                <p>Novela y Clásico</p>
                <p>Estado: Prestado</p>
            </article>
        </seccion>
    </main>
    <footer>
        <p>Portal de Biblioteca</p>
    </footer>
    
</body>
</html>
