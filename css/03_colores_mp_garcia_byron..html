<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colores</title>
    <style>
        body {
            background-color: black;
        }
        h1 {
            color: red;
        }
        h2 {
            color: #Ff0000;
        }
        h3 {
            color: rgb(255,0,0);
        }
        h4 {
            color: rgba(255, 0,0,0.8);
        }
        h5 {
            color: hsl(0, 100%, 50%);
        }

    </style>
</head>
<body>
    <h1>Control de biblioteca/h1>
    <h2>Categoria</h2>
    <h3>Romance</h3>
    <h4>Amor toxico</h4>
    <h5>Cien años de soledad</h5>
    <h6>amor y prefucio</h6>
</body>
</html>
