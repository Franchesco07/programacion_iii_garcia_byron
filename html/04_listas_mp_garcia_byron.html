<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Listas para un control de biblioteca </h1>
    <h1>Lista ordenada</h1>
    <!-- Lista de elementos con orden especifico (ordered list) -->
    <ol>
        <li>Cien años de soledad</li>
        <li>1984</li>
        <li>Don Quijote de la Mancha</li>
        <li>El Principito</li>
    </ol>
    <h1>Lista desordenada</h1>
    <!-- Lista de elementos sin orden especifico (unordered list) -->
    <ul>
        <li>Cien años de Soledad</li>
        <li>1984</li>
        <li>Don Quijote de la Mancha</li>
        <li>El Principito</li>
    </ul>

</body>
</html>
